clear

//client settings

fps_max 200

fov_desired 110
viewmodel_fov 74

cl_showfps 1
cl_stickyironsight 1
cl_spec_mode 4
cl_threaded_bone_setup 1
cl_threaded_client_leaf_system 1
cl_voicesubtitles 1

r_flashlightdepthtexture 0
r_shadowmaxrendered 32
r_threaded_renderables 1
r_threaded_particles 1
r_threaded_client_shadow_manager 1

engine_no_focus_sleep 0

//sound settings

snd_mixahead 0.08
snd_pitchquality 1
dsp_slow_cpu 0
dsp_enhance_stereo 1
dsp_vol_2ch 1
bind p snd_restart

//server settings

sv_consistency 0
rate 100000
cl_cmdrate 100
cl_updaterate 100
cl_timeout 80
cl_interp 0.0
cl_interp_ratio 0
net_splitrate 1024
net_splitpacket_maxrate 100000
net_maxroutable 1280
cl_resend 1.5
cl_timeout 80

//toggle voice chat
alias voice_tog voice_on
alias voice_on "+voicerecord; echo VOICE ON; alias voice_tog voice_off"
alias voice_off "-voicerecord; echo VOICE OFF; alias voice_tog voice_on"
bind "mouse3" "voice_tog" 

//anti kick 

alias "w2" "wait; wait"
alias "afkOn" "+duck; cl_yawspeed 1000; +left; w2; alias afk afkOff"
alias "afkOff" "-duck; cl_yawspeed 210; -left; w2; alias afk afkOn"
alias afk afkOn
bind F1 afk

echo ==========================
echo  HawkActuals Config Loaded!
echo        ver 0.0.1
echo ==========================
play TextChat.wav
